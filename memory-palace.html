<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maritime Memory Palace 3D — COLREGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif;color:#e8f4fd}
#c{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}

/* Back button */
#btn-back{
  position:fixed;top:16px;left:16px;z-index:50;
  color:#6a9abf;background:rgba(5,12,24,0.9);
  border:1px solid rgba(30,60,95,0.6);border-radius:8px;
  padding:8px 14px;font-size:0.82rem;font-weight:600;
  cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;
  transition:all .2s;backdrop-filter:blur(8px);
}
#btn-back:hover{color:#f0c040;border-color:rgba(240,192,64,0.5)}

/* Title HUD */
#hud{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;
  text-align:center;pointer-events:none;
}
#hud-title{color:#f0c040;font-size:1.1rem;font-weight:900;letter-spacing:.08em;text-shadow:0 0 20px rgba(240,192,64,.4)}
#hud-sub{color:#3a6a8a;font-size:.72rem;margin-top:3px;letter-spacing:.04em}

/* Controls hint */
#hint{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  color:rgba(58,106,138,.7);font-size:.7rem;pointer-events:none;z-index:40;
  text-align:center;letter-spacing:.04em;
}

/* Zone tooltip */
#tip{
  position:fixed;pointer-events:none;z-index:60;
  background:rgba(5,12,24,0.95);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:8px 14px;transform:translate(-50%,-130%);
  opacity:0;transition:opacity .15s;backdrop-filter:blur(12px);white-space:nowrap;
}
#tip.on{opacity:1}
#tip-name{font-size:.88rem;font-weight:700;color:#fff}
#tip-rules{font-size:.72rem;color:#5a8aaa;margin-top:2px}

/* Rule panel */
#panel{
  position:fixed;top:0;right:0;bottom:0;width:400px;z-index:70;
  background:rgba(5,12,24,0.97);border-left:1px solid rgba(30,60,95,.5);
  transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);
  overflow-y:auto;backdrop-filter:blur(16px);
}
#panel.open{transform:translateX(0)}
#panel-head{
  padding:18px 20px 14px;border-bottom:1px solid rgba(30,60,95,.5);
  position:sticky;top:0;background:rgba(5,12,24,.99);z-index:1;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
#panel-head-content{flex:1;min-width:0}
.p-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;
  margin-bottom:8px;
}
.p-name{font-size:1.15rem;font-weight:900;color:#e8f4fd}
.p-sub{font-size:.78rem;color:#3a6a8a;margin-top:2px}
#panel-close{
  width:30px;height:30px;flex-shrink:0;border:1px solid rgba(30,60,95,.7);
  border-radius:7px;background:rgba(20,40,70,.4);color:#3a6a8a;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all .15s;
}
#panel-close:hover{color:#fff;border-color:rgba(240,192,64,.5)}
#panel-body{padding:18px 20px 40px}
.mem-block{
  background:rgba(240,192,64,.07);border:1px solid rgba(240,192,64,.2);
  border-radius:10px;padding:12px 14px;margin-bottom:18px;
  font-size:.84rem;color:#f0c040;line-height:1.65;
}
.mem-block::before{content:'💡 '}
.rc{
  background:rgba(18,36,62,.7);border:1px solid rgba(30,60,95,.6);
  border-radius:10px;margin-bottom:12px;overflow:hidden;
}
.rc-head{
  display:flex;align-items:center;gap:9px;padding:9px 13px;
  border-bottom:1px solid rgba(30,60,95,.4);
}
.rc-num{
  background:#f0c040;color:#051020;font-weight:900;font-size:.7rem;
  padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;
}
.rc-title{font-weight:700;font-size:.88rem;color:#c8e4f7}
.rc-body{padding:10px 13px}
.rc-key{font-size:.8rem;color:#4a7a9b;line-height:1.7;margin-bottom:9px}
.rc-trick{
  font-size:.78rem;line-height:1.6;color:#c4b5fd;
  background:rgba(139,92,246,.1);border-left:3px solid #8b5cf6;
  padding:7px 10px;border-radius:0 7px 7px 0;
}

/* Bottom zone chips */
#chips{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:6px 12px 10px;
  background:linear-gradient(to top,rgba(3,8,18,.97) 55%,transparent);
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:5px 11px;border-radius:999px;border:1px solid;
  font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.chip:hover,.chip.sel{filter:brightness(1.4);transform:translateY(-2px)}

/* Loading */
#load{
  position:fixed;inset:0;background:#020810;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:200;transition:opacity .8s;
}
#load.out{opacity:0;pointer-events:none}
#load-title{color:#f0c040;font-size:1.1rem;font-weight:800;letter-spacing:.1em}
#load-sub{color:#3a6a8a;font-size:.78rem}
#load-bar{width:180px;height:3px;background:rgba(30,60,95,.5);border-radius:3px;overflow:hidden}
#load-bar-fill{height:100%;background:#f0c040;border-radius:3px;width:0;transition:width .1s}

@media(max-width:700px){
  #panel{width:100%}
  #hint{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="load">
  <div id="load-title">⚓ MARITIME MEMORY PALACE</div>
  <div id="load-sub">Building the ship...</div>
  <div id="load-bar"><div id="load-bar-fill"></div></div>
</div>

<a href="index.html" id="btn-back">← Quiz</a>
<div id="hud">
  <div id="hud-title">⚓ MARITIME MEMORY PALACE</div>

</div>
<div id="hint">🖱 Drag to orbit · Scroll to zoom · Click a glowing orb or chip below</div>

<div id="tip"><div id="tip-name"></div><div id="tip-rules"></div></div>

<div id="panel">
  <div id="panel-head">
    <div id="panel-head-content"></div>
    <button id="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="chips"></div>

<script type="importmap">

// ── ZONE CONFIGS ──
const ZONE_CFG = [
  { id:'keel',      name:'The Keel',           emoji:'🌊', hex:0x0ea5e9, css:'#0ea5e9', pos:[0,-1.6,0],    cp:[18,2,2],    ct:[0,-1.5,0] },

  { id:'port',      name:'Port Side',           emoji:'🔴', hex:0xef4444, css:'#ef4444', pos:[-5.5,2.5,-4], cp:[-17,7,-1],  ct:[-5,2,-4] },
  { id:'starboard', name:'Starboard Side',      emoji:'🟢', hex:0x22c55e, css:'#22c55e', pos:[5.5,2.5,4],   cp:[17,7,6],    ct:[5,2,4] },
  { id:'stern',     name:'The Stern',           emoji:'⬡',  hex:0xf0c040, css:'#f0c040', pos:[0,2.5,16.5],  cp:[3,10,26],   ct:[0,2.5,15] },
  { id:'engine',    name:'Engine Room',         emoji:'⚙️', hex:0xf97316, css:'#f97316', pos:[0,-0.5,10],   cp:[14,2,16],   ct:[0,-0.5,10] },
  { id:'anchor',    name:'Anchor Locker',       emoji:'⚓', hex:0x64748b, css:'#64748b', pos:[2.5,0.5,-14], cp:[9,5,-22],   ct:[2,0.5,-13] },
  { id:'lights',    name:'Signal Lights',       emoji:'💡', hex:0xfbbf24, css:'#fbbf24', pos:[0,8.5,-6],    cp:[10,13,-1],  ct:[0,8.5,-6] },
  { id:'channels',  name:'Channels · TSS · Fog',emoji:'🌊', hex:0x14b8a6, css:'#14b8a6', pos:[0,-0.2,-22],  cp:[10,5,-30],  ct:[0,0,-20] },
];

// ── RULE DATA ──
const ZONE_DATA = {
  keel:{
    memory:'The keel runs the full length of the ship — it IS the ship. Rules 1-3 are the full foundation of COLREGS: where they apply, who stays responsible, and what every word means.',
    rules:[
      {num:'1',title:'Application',key:'Applies to ALL vessels upon the high seas and all waters connected therewith navigable by seagoing vessels. Inland Rules cover US navigable inland waters.',trick:'🌍 "ALL vessels, ALL waters." No exceptions hidden in the keel. The word ALL is deliberate — no vessel type is exempt.'},
      {num:'2',title:'Responsibility',key:'Nothing in the rules exonerates any vessel from consequences of neglect or failure to observe good seamanship. The "General Prudential Rule": if following the rules strictly would cause a collision, DEPART from them.',trick:'⚖️ "The rules don\'t make you invincible." You\'re the captain — always. If blindly following a rule leads to collision, break it. Common sense is mandatory, not optional.'},
      {num:'3',title:'General Definitions',key:'Vessel = every watercraft (including WIG/seaplanes). Power-driven = using machinery. Sailing = sail only, NO machinery in use. NUC = exceptional circumstance unable to maneuver. RAM = nature of work limits maneuverability. CBD = draft vs. depth limits deviation. Underway = not anchored/moored/aground. Making way = actually moving through water.',trick:'📖 "Underway ≠ Moving." Underway = not anchored/moored/aground (drifting = underway!). Making way = engine or sail actually pushing through water. This distinction controls which fog signals you use.'}
    ]
  },
  lookout:{
    memory:'"From the crow\'s nest, you ALWAYS watch." The lookout never sleeps. Sight, hearing, radar, AIS — every tool available, all the time.',
    rules:[
      {num:'5',title:'Look-out',key:'Every vessel shall at ALL TIMES maintain a proper lookout by sight and hearing as well as by all available means appropriate to the prevailing circumstances, so as to make a full appraisal of the situation and of the risk of collision.',trick:'🦅 "ALL TIMES — no exceptions." No breaks, not just in restricted visibility. ALL available means = sight + hearing + radar + AIS + VHF. The most absolute rule in COLREGS. If you miss a collision risk, Rule 5 is always cited.'}
    ]
  },
  bridge:{
    memory:'"The captain on the bridge makes three decisions: How fast? (R6)  Is there risk? (R7)  How do I act? (R8). Safe · Watchful · Bold."',
    rules:[
      {num:'6',title:'Safe Speed',key:'Every vessel shall at ALL TIMES proceed at a safe speed. Factors: visibility, traffic density, vessel maneuverability (especially stopping distance), background lights at night, state of wind/sea/current, draft vs. available depth, radar capability and limitations.',trick:'🚗 "Conditions dictate your speed." The rule lists factors but gives no speed numbers. Fog = slow down. Dense traffic = slow down. Poor radar = slow down. ALL TIMES appears again — safe speed is constant.'},
      {num:'7',title:'Risk of Collision',key:'Use ALL available means to determine collision risk. If radar is fitted, use it properly and systematically, including long-range scanning. CONSTANT BEARING + DECREASING RANGE = collision risk. If in DOUBT whether risk exists — it SHALL be deemed to EXIST.',trick:'📡 "Steady bearing = DANGER." Imagine a gun aimed at you: if the angle never changes, the bullet hits. In doubt? The rule says risk EXISTS — err on the side of caution. Scanty radar information is NOT enough to confirm safety.'},
      {num:'8',title:'Action to Avoid Collision',key:'Action shall be: POSITIVE (large enough to be obvious), made in AMPLE TIME, result in passing at SAFE DISTANCE. Avoid a SUCCESSION of small alterations — one large clear maneuver is better. If necessary: slow, stop, or go astern.',trick:'💪 "Make a BIG move, EARLY." Small wiggles confuse — a 30° course change looks intentional. Multiple small changes look like indecision. One clear big action early leaves no doubt. Yes, stopping is always an option.'}
    ]
  },
  foghorn:{
    memory:'"1=starboard, 2=port, 3=astern, 5+=DANGER. In fog: 1 long blast every 2 minutes if making way."',
    rules:[
      {num:'32',title:'Definitions — Blast Lengths',key:'SHORT blast ≈ 1 second. PROLONGED blast = 4 to 6 seconds.',trick:'⏱️ "Short = snap your fingers. Prolonged = count one-one-thousand, two, three, four — that\'s minimum 4 seconds."'},
      {num:'34',title:'Maneuvering & Warning Signals',key:'In sight of another vessel: 1 short = altering to STARBOARD. 2 short = altering to PORT. 3 short = operating engines ASTERN. 5+ short/rapid = DANGER or DOUBT signal. (Inland: 1 prolonged+1 short = port-to-port; 1 prolonged+2 short = stbd-to-stbd agreement.)',trick:'🖐️ "Count your fingers: ONE right, TWO left, THREE back, FIVE = DANGER." COLREGS: maneuvering signals = action signals. Inland Rules: intent signals — sound before you act, wait for agreement.'},
      {num:'35',title:'Fog Signals',key:'Power MAKING WAY: 1 prolonged blast ≤every 2 min. Power STOPPED (not making way): 2 prolonged blasts ≤every 2 min. Sailing/NUC/RAM/CBD/fishing/towing: 1 prolonged + 2 short (— • •) ≤every 2 min. AT ANCHOR <100m: rapid bell ~5 sec ≤every 1 min. ≥100m: bell forward + gong aft.',trick:'🌫️ "Making way = 1 long. Stopped = 2 long. Everything special = .- - (dit-dah-dah). Anchor = DING DING (bell)." A sailing vessel sounds .- - even though it has priority — in fog there is no hierarchy.'},
      {num:'37',title:'Distress Signals',key:'Gun/explosive at ~1 min intervals, SOS by any means, Mayday by radio, NC flag+ball, flames on vessel, orange smoke, slowly raising/lowering outstretched arms, EPIRB, red rocket/parachute flares, dye marker, white light 50-70 flashes/min.',trick:'🆘 "SOS = dit-dit-dit dah-dah-dah dit-dit-dit. Orange smoke = daytime. Red flares = nighttime. Raising/lowering arms = the silent wave of distress. EPIRB = automatic satellite beacon."'}
    ]
  },
  bow:{
    memory:'"Bow to bow — BOTH swing to starboard. Pass port-to-port. Like cars on a road: both drive on the right."',
    rules:[
      {num:'14',title:'Head-on Situation',key:'When two POWER-DRIVEN vessels are approaching on reciprocal or nearly reciprocal courses creating risk of collision, EACH shall alter course to STARBOARD so they pass port-to-port. When in doubt about whether a head-on situation exists — ASSUME it does.',trick:'🚗 "Two cars meeting head-on: both drive RIGHT (starboard)." Signs of head-on: you see BOTH sidelights (red and green) + masthead light dead ahead. If unsure — assume head-on, go starboard.'}
    ]
  },
  port:{
    memory:'"Red = Port = Left. If your wind is on the PORT (red/left) side, you GIVE WAY."',
    rules:[
      {num:'12',title:'Sailing Vessels',key:'Two sailing vessels meeting: (1) Different tacks — vessel on PORT tack gives way. (2) Same tack — WINDWARD vessel gives way to leeward. (3) Port-tack vessel cannot determine other\'s tack — give way if YOU are on PORT tack.',trick:'💨 "PORT tack GIVES WAY — both rules." If wind hits your LEFT (port) side first, you\'re on port tack — you give way. Windward = upwind — you also give way. Memory: \'I\'m on the RED side = I yield.\''  },
      {num:'13',title:'Overtaking — The Obligation',key:'ANY vessel (power or sail) overtaking another is the give-way vessel. You are overtaking if approaching from more than 22.5° ABAFT THE BEAM (within the sternlight arc of 135°). Once overtaking, ALWAYS overtaking — cannot escape by maneuvering into an apparent crossing situation.',trick:'🏃 "If you\'re in the cone of their white sternlight (135° arc), you\'re overtaking." \'Once overtaking, always overtaking\' prevents games where the overtaker claims crossing status.'}
    ]
  },
  starboard:{
    memory:'"See their GREEN light coming at you? They\'re showing you their starboard side = YOU give way. Act EARLY and SUBSTANTIALLY."',
    rules:[
      {num:'15',title:'Crossing Situation',key:'When two power-driven vessels cross and risk of collision exists: the vessel that has the other on HER OWN STARBOARD SIDE shall give way. Give-way vessel shall AVOID crossing ahead of the stand-on vessel — pass ASTERN instead.',trick:'🟢 "See their green light = you see their starboard = you are on their right = YOU give way." The green light is a green light for THEM — not for you. Pass behind them, not in front.'},
      {num:'16',title:'Action by Give-way Vessel',key:'The give-way vessel shall take EARLY and SUBSTANTIAL action to keep WELL CLEAR.',trick:'⏰ "EARLY = don\'t wait. SUBSTANTIAL = make it obvious." Not a tiny wiggle at the last second — a real clear maneuver that leaves no doubt you\'ve seen them and you\'re moving. Three words: EARLY, BIG, CLEAR.'},
      {num:'17',title:'Action by Stand-on Vessel',key:'Stand-on vessel: (i) shall MAINTAIN COURSE AND SPEED. (ii) MAY take action at any time. But: when collision becomes apparent because give-way vessel is NOT acting — stand-on MUST take action to avoid.',trick:'🎯 "Stand-ON = stay ON." You maintain course so the give-way vessel knows where you\'ll be. But once it\'s clear they won\'t act — YOU must act. This isn\'t a death pact.'},
      {num:'18',title:'Responsibilities Between Vessels',key:'HIERARCHY (most privileged → must be kept clear of): NUC → RAM → Constrained by Draft → Engaged in Fishing → Under Sail → Power-driven. Seaplanes and WIG craft give way to all.',trick:'🏆 "Never Ridiculous Cats Feed Sleeping Pigs" = NUC, RAM, CBD, Fishing, Sailing, Power. Power at the BOTTOM — engines give you the most options. NUC at the TOP — no options at all.'}
    ]
  },
  stern:{
    memory:'"Approaching from behind the 135° sternlight arc? You\'re overtaking. You give way — always, until you\'re past and clear."',
    rules:[
      {num:'13',title:'Overtaking — The Arc',key:'The 135° sternlight arc defines the overtaking zone. Any vessel coming from more than 22.5° abaft the other vessel\'s beam — from either side — is overtaking. Rule 13 takes precedence over crossing rules (Rules 14-17). Once overtaking, always overtaking.',trick:'🏁 "The white sternlight shines 135° behind the vessel. If you\'re in that white-light zone — you\'re overtaking." Stand at the stern and look backwards — everything in that arc must yield to you. Now reverse it: if you\'re in SOMEONE ELSE\'s arc, you yield.'}
    ]
  },
  engine:{
    memory:'"Power = masthead on. No engine = no masthead. Special status = special lights. The engine room determines what lights you show."',
    rules:[
      {num:'23',title:'Power-driven Vessels Underway',key:'Masthead light (white, 225°) + sidelights (red/green) + sternlight (white, 135°). Vessels ≥50m: TWO masthead lights (forward lower, aft higher). Vessels <12m: may use all-round white + sidelights instead.',trick:'🚢 "Headlights (masthead) + indicators (sidelights) + tail light (sternlight)." Big ship ≥50m: TWO masthead lights — from ahead, one above the other. If they form a vertical line = head-on. If staggered = crossing.'},
      {num:'24',title:'Towing & Pushing',key:'TOWING: extra masthead lights in vertical line (2 total if tow ≤200m, 3 if tow >200m) + yellow towing light above sternlight. TOW displays: sidelights + sternlight REPLACED BY yellow sternlight. PUSHING: both vessels together show power-driven lights; forward vessel carries sidelights at forward end.',trick:'🛥️ "Towing = extra whites UP TOP + yellow at stern (the leash light). Long tow >200m = 3 masthead lights. The TOW ITSELF gets yellow sternlight — yellow = attached to something."'},
      {num:'25',title:'Sailing Vessels & Under Oars',key:'SAILING: sidelights + sternlight (may combine into tricolor at mast top). May ALSO show all-round red (top) + all-round green (bottom) at mast. Under oars: sidelights + sternlight, OR red-over-green all-round. When using engine + sail: cone apex-down by day = power vessel.',trick:'⛵ "Sailing = NO masthead light. That white masthead = engine." Sailing + motor = cone shape. The cone says I\'m using my engine! Red over green (optional at mast) = Christmas tree lights.'},
      {num:'26',title:'Fishing Vessels',key:'TRAWLING: green all-round over white all-round + sidelights (if making way). OTHER FISHING: red all-round over white all-round + white in direction if gear extends >150m. Trolling is NOT fishing under COLREGS.',trick:'🎣 "Trawling = GREEN over white. All other fishing = RED over white." Gear sticking out? White light points the way. Trolling = power vessel (no special lights).'},
      {num:'27',title:'NUC & RAM Vessels',key:'NUC: two ALL-ROUND RED lights vertical (day: two black balls). RAM: red–white–red all-round vertical (day: ball–diamond–ball). BOTH add sidelights + sternlight if making way. Dredging: red/balls on obstruction side, green/white balls on passable side.',trick:'🔴 "NUC = 2 REDS (\'I\'m in trouble\'). RAM = red–WHITE–red (special status sandwich)." Dredge: RED = danger/obstruction side, GREEN = safe side to pass.'},
      {num:'28',title:'Vessels Constrained by Draft',key:'May display THREE ALL-ROUND RED lights in a vertical line (night) and/or a CYLINDER shape (day). Only POWER-DRIVEN vessels may claim CBD status.',trick:'🔴🔴🔴 "Three reds stacked = I\'m stuck in deep water, I cannot turn." The cylinder shape = a barrel saying \'full, can\'t move.\' Only power vessels get CBD — sailing vessels do not.'},
      {num:'29',title:'Pilot Vessels',key:'White ALL-ROUND over red ALL-ROUND + sidelights and sternlight when underway. Anchor light when at anchor.',trick:'⚪🔴 "Pilot = white hat over red jacket." White over red = pilot vessel. Think harbour pilot wearing a white cap with red band.'}
    ]
  },
  anchor:{
    memory:'"At anchor: 1 white ball by day, 1 all-round white light by night. Big ship (≥50m): add 2nd white light at stern. Aground: add 3 reds + 3 balls."',
    rules:[
      {num:'30',title:'Anchored Vessels & Vessels Aground',key:'AT ANCHOR day: one BLACK BALL shape in fore part. Night: one ALL-ROUND WHITE light in fore part. Vessels ≥50m: ALSO all-round white at stern + may illuminate decks. AGROUND: anchor lights/shapes PLUS three all-round RED lights vertical, PLUS three black balls vertical.',trick:'⚓ "1 white ball = 1 white light = at anchor. Small ship = 1 light. Big ship = 2 lights (fore and aft). AGROUND adds 3 REDS and 3 BALLS — the \'3\' signals serious danger." Think: anchor = 1; aground = 1 + 3.'}
    ]
  },
  lights:{
    memory:'"225° forward + 135° aft = 360°. Two sidelights × 112.5° = the masthead arc. The geometry is perfect — a vessel\'s own lights cover a complete circle."',
    rules:[
      {num:'20',title:'Application of Lights',key:'Lights required from sunset to sunrise. Also required in restricted visibility during daylight. Vessels shall not show lights that could be mistaken for navigation lights.',trick:'🌙 "Lights on at sunset, off at sunrise — PLUS any time you can\'t see well." The no-confusion clause matters: don\'t run decklights that look like sidelights.'},
      {num:'21',title:'Definitions — Light Arcs',key:'MASTHEAD: white, 225° arc (112.5° each side of ahead). SIDELIGHT: red (port) or green (stbd), each 112.5° from dead ahead to 22.5° abaft beam. STERNLIGHT: white, 135° (67.5° each side of dead astern). ALL-ROUND: 360°. TOWING LIGHT: yellow, same 135° arc as sternlight.',trick:'🔢 "Masthead 225° + Sternlight 135° = 360°. The two sidelights (112.5° × 2 = 225°) exactly mirror the masthead arc. A vessel\'s own lights cover a full 360° — nothing left in the dark."'},
      {num:'22',title:'Visibility of Lights',key:'≥50m vessels: masthead 6 miles, sidelights 3 miles, sternlight 3 miles. 12–50m: masthead 5 miles (or 3 if <20m), sidelights/sternlight 2 miles. <12m: 2 miles all-round white OR sidelights 1 mile + sternlight 2 miles.',trick:'📏 "Bigger ship = seen farther." The key threshold is 50m. Masthead light always reaches farthest. <12m vessels have more flexible options.'}
    ]
  },
  channels:{
    memory:'"Channel = drive right (starboard). TSS = stay in lane, cross at 90°. Fog = slow down, nobody has right-of-way, LISTEN."',
    rules:[
      {num:'9',title:'Narrow Channels & Fairways',key:'Keep to STARBOARD side of narrow channel. Vessels <20m, sailing vessels, and fishing vessels SHALL NOT impede vessels that can ONLY navigate safely within the channel. Vessels crossing a narrow channel shall not impede channel traffic. No anchoring unless necessary.',trick:'🛣️ "Narrow channel = a road. Drive on the RIGHT (starboard)." Small vessels, sailors, fishing boats: a large ship in a tight channel physically cannot move for you. Think of a big truck in a narrow alley — the bike yields.'},
      {num:'10',title:'Traffic Separation Schemes (TSS)',key:'Use correct traffic LANE; proceed in the general direction of traffic flow. Joining lane: enter at a small angle from the side. CROSSING a lane: cross as nearly as practicable at RIGHT ANGLES to the traffic flow. Vessels <20m, sailing, and fishing shall not impede lane vessels.',trick:'🛣️ "TSS = maritime highway. Stay in your lane." Cross at 90° — the most visible, fastest, safest way. Joining: like merging from a slip road. Crossing: like a pedestrian crossing — go straight across.'},
      {num:'19',title:'Conduct in Restricted Visibility',key:'All vessels: SAFE SPEED with engines ready. Rules 11–18 (in-sight rules) DO NOT APPLY — no vessel has right-of-way in fog. On hearing fog signal FORWARD OF BEAM: reduce to minimum steerage speed, navigate with extreme caution, prepare to stop. Radar-only contact: avoid altering to PORT for targets forward of beam; avoid turning toward beam/astern contacts.',trick:'🌫️ "In fog, nobody has right-of-way." Rules 11–18 only apply when vessels are in sight — fog removes that condition. Hear fog signal ahead? SLOW DOWN immediately. The two radar turn rules: forward contact = don\'t go left; beam/astern contact = don\'t turn toward it.'}
    ]
  }
};

// ── RENDERER ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

// ── SCENE ──
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020810, 0.014);
scene.background = new THREE.Color(0x020810);

// ── CAMERA ──
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(28, 16, 30);

// ── CONTROLS ──
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 7;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.54;
controls.update();

// ── POST PROCESSING ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.1, 0.35, 0.0
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── LIGHTS ──
scene.add(new THREE.AmbientLight(0x061828, 0.5));

const moon = new THREE.DirectionalLight(0x4466aa, 0.9);
moon.position.set(-20, 35, -15);
scene.add(moon);

const deckFill = new THREE.PointLight(0x223355, 2.5, 30);
deckFill.position.set(0, 6, 0);
scene.add(deckFill);

// Nav lights (atmosphere)
const portPL = new THREE.PointLight(0xff2222, 4, 10);
portPL.position.set(-5, 2.3, -5);
scene.add(portPL);
const stbdPL = new THREE.PointLight(0x22ff55, 4, 10);
stbdPL.position.set(5, 2.3, -5);
scene.add(stbdPL);
const mastheadPL = new THREE.PointLight(0xffffff, 2.5, 22);
mastheadPL.position.set(0, 9.5, -2);
scene.add(mastheadPL);

// ── OCEAN ──
const oceanUni = { time:{ value:0 } };
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400, 80, 80),
  new THREE.ShaderMaterial({
    uniforms: oceanUni,
    vertexShader:`
      uniform float time;
      varying vec2 vUv;
      varying float vH;
      void main(){
        vUv=uv;
        vec3 p=position;
        p.y+=sin(p.x*.22+time*.7)*.38+sin(p.z*.28+time*.5)*.32+sin(p.x*.55+p.z*.38+time)*.14;
        vH=p.y;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
      }
    `,
    fragmentShader:`
      uniform float time;
      varying vec2 vUv;
      varying float vH;
      void main(){
        vec3 deep=vec3(.01,.04,.10);
        vec3 crest=vec3(.04,.12,.28);
        float t=smoothstep(-.35,.45,vH);
        vec3 col=mix(deep,crest,t);
        float shimmer=sin(vUv.x*45.+time*2.2)*sin(vUv.y*38.+time*1.6)*.04;
        col+=shimmer*vec3(.08,.25,.45);
        gl_FragColor=vec4(col,.9);
      }
    `,
    transparent:true,
    side:THREE.FrontSide,
  })
);
ocean.rotation.x = -Math.PI/2;
ocean.position.y = -0.5;
scene.add(ocean);

// ── STARS ──
const starPos = new Float32Array(3000*3);
for(let i=0;i<3000;i++){
  const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1), r=160+Math.random()*60;
  starPos[i*3]  =r*Math.sin(ph)*Math.cos(th);
  starPos[i*3+1]=Math.abs(r*Math.cos(ph));
  starPos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:.5,sizeAttenuation:true,transparent:true,opacity:.85})));

// ── SHIP ──
function buildShip(){
  const g = new THREE.Group();
  const mats = {
    hull:    new THREE.MeshStandardMaterial({color:0x1a2535,roughness:.75,metalness:.35}),
    super:   new THREE.MeshStandardMaterial({color:0x1e3050,roughness:.7,metalness:.3}),
    bridge:  new THREE.MeshStandardMaterial({color:0x1e3a60,roughness:.65,metalness:.25}),
    mast:    new THREE.MeshStandardMaterial({color:0x283540,roughness:.8,metalness:.5}),
    deck:    new THREE.MeshStandardMaterial({color:0x111d2c,roughness:.95}),
    win:     new THREE.MeshStandardMaterial({color:0x001828,roughness:.1,metalness:.9,emissive:0x001830,emissiveIntensity:.6}),
    funnel:  new THREE.MeshStandardMaterial({color:0x0f1820,roughness:.8,metalness:.5}),
    gold:    new THREE.MeshStandardMaterial({color:0xc89a20,roughness:.3,metalness:.9,emissive:0x441800,emissiveIntensity:.4}),
    navRed:  new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:4,roughness:.1}),
    navGreen:new THREE.MeshStandardMaterial({color:0x00ff44,emissive:0x00ff44,emissiveIntensity:4,roughness:.1}),
    navWhite:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:3,roughness:.1}),
  };

  function box(w,h,d,mat,x,y,z){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x||0,y||0,z||0); g.add(m); return m;
  }
  function cyl(rt,rb,h,mat,x,y,z,rx){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),mat);
    m.position.set(x||0,y||0,z||0);
    if(rx) m.rotation.z=rx;
    g.add(m); return m;
  }
  function sph(r,mat,x,y,z){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),mat);
    m.position.set(x||0,y||0,z||0); g.add(m); return m;
  }

  // Hull
  box(10,2,28,mats.hull,0,-1.5,0);
  box(10.6,1.6,26,mats.hull,0,.2,0);
  // Bow taper
  [[9,.1,-14.5],[7,-.3,-15.5],[4.5,-.7,-16.2],[2,-.9,-16.8]].forEach(([w,y,z])=>
    box(w,2.2,1.3,mats.hull,0,y-.7,z));
  // Stern
  box(9,2,1.5,mats.hull,0,-.5,14.5);
  box(6.5,1.8,1.2,mats.hull,0,-1,15.5);

  // Main deck
  box(11,0.18,27,mats.deck,0,1.59,0);
  // Forecastle
  box(10.5,1.4,6,mats.super,0,2.25,-10.5);
  // Bridge
  box(10,3.6,7.5,mats.bridge,0,3.3,-2);
  // Bridge windows (forward face z≈-5.75)
  for(let x=-3.5;x<=3.5;x+=1.42)
    box(.95,.82,.1,mats.win,x,3.2,-5.77);
  // Aft super
  box(10,2.6,7,mats.super,0,2.8,7);
  // Funnel
  cyl(1.2,1.7,3.8,mats.funnel,0,6,8);
  cyl(1.55,1.55,.32,mats.gold,0,7.96,8);

  // Foremast
  cyl(.09,.13,13,mats.mast,0,8.1,-9);
  // Foremast crossbar
  const fxb=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,6.5,8),mats.mast);
  fxb.rotation.z=Math.PI/2; fxb.position.set(0,4,-9); g.add(fxb);
  // Crow's nest
  cyl(.9,.65,.7,mats.super,0,14.6,-9);
  // Crow's nest rim
  cyl(.92,.92,.12,mats.mast,0,14.97,-9);

  // Main mast
  cyl(.08,.1,5.5,mats.mast,0,7.25,-2);
  const mxb=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,5,8),mats.mast);
  mxb.rotation.z=Math.PI/2; mxb.position.set(0,6.4,-2); g.add(mxb);

  // Stays
  function stay(x1,y1,z1,x2,y2,z2){
    const a=new THREE.Vector3(x1,y1,z1),b=new THREE.Vector3(x2,y2,z2);
    const d=b.clone().sub(a),l=d.length(),mid=a.clone().add(d.clone().multiplyScalar(.5));
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,l,4),
      new THREE.MeshStandardMaterial({color:0x1a2a3a,roughness:.9}));
    c.position.copy(mid);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    g.add(c);
  }
  stay(0,14.6,-9,0,1.6,-17.2);
  stay(0,14.6,-9,5,1.6,-9);
  stay(0,14.6,-9,-5,1.6,-9);
  stay(0,14.6,-9,0,3.4,0);

  // Railings
  for(let z=-12;z<=12;z+=2.5){
    [-5.2,5.2].forEach(x=>cyl(.05,.05,1.2,mats.mast,x,2.2,z));
  }
  box(.08,.08,26.5,mats.mast,-5.2,2.88,-.5);
  box(.08,.08,26.5,mats.mast,5.2,2.88,-.5);

  // Anchor
  const aGrp=new THREE.Group(); aGrp.position.set(2.5,.85,-14);
  aGrp.add(Object.assign(new THREE.Mesh(new THREE.TorusGeometry(.45,.07,8,16),mats.mast)));
  const ashk=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.7,8),mats.mast);
  ashk.position.y=-1; aGrp.add(ashk);
  const aarm=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,.1),mats.mast);
  aarm.position.y=-1.85; aGrp.add(aarm);
  g.add(aGrp);

  // Propeller
  const pGrp=new THREE.Group(); pGrp.position.set(0,-1.3,15.8);
  for(let i=0;i<3;i++){
    const bl=new THREE.Mesh(new THREE.BoxGeometry(.12,1.4,.38),mats.mast);
    bl.rotation.z=(i/3)*Math.PI*2;
    bl.position.set(Math.cos((i/3)*Math.PI*2)*.7,Math.sin((i/3)*Math.PI*2)*.7,0);
    pGrp.add(bl);
  }
  g.add(pGrp);

  // Nav light spheres (emissive)
  sph(.18,mats.navRed,-5.1,2.35,-5);
  sph(.18,mats.navGreen,5.1,2.35,-5);
  sph(.22,mats.navWhite,0,9.5,-2);  // masthead
  sph(.15,mats.navWhite,0,2.1,16);  // sternlight

  // Some cargo deck details
  for(let z=-6;z<=4;z+=3)
    box(.8,.5,.8,mats.super,0,1.77,z);
  // Deckhouse porthole circles (just discs)
  [[-2.5],[-1],[ 0.5],[2]].forEach(([z])=>{
    const disc=new THREE.Mesh(new THREE.CircleGeometry(.2,12),mats.win);
    disc.rotation.y=Math.PI/2; disc.position.set(-5.02,3.2,z); g.add(disc);
  });

  return g;
}

const ship = buildShip();
scene.add(ship);

// ── ZONE ORBS ──
const orbData = [];
const orbMeshes = [];

ZONE_CFG.forEach(cfg=>{
  const grp = new THREE.Group();
  grp.position.set(...cfg.pos);

  const col = new THREE.Color(cfg.hex);

  // Inner glow sphere
  const inner = new THREE.Mesh(
    new THREE.SphereGeometry(.38,20,20),
    new THREE.MeshStandardMaterial({
      color:col, emissive:col, emissiveIntensity:3.5,
      roughness:.05, metalness:.3, transparent:true, opacity:.95
    })
  );
  grp.add(inner);

  // Outer wireframe ring (torus)
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(.6,.04,8,32),
    new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:2,transparent:true,opacity:.8})
  );
  grp.add(ring);

  // Second ring (perpendicular)
  const ring2 = ring.clone();
  ring2.rotation.x = Math.PI/2;
  grp.add(ring2);

  // Subtle point light
  const pl = new THREE.PointLight(cfg.hex, 1.2, 7);
  grp.add(pl);

  scene.add(grp);

  const entry = { grp, inner, ring, ring2, pl, cfg };
  orbData.push(entry);
  orbMeshes.push(inner); // raycasting target
});

// ── RAYCASTING & HOVER ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredOrb = null;
let selectedId = null;
let camAnimating = false;
let camDest = new THREE.Vector3();
let camTargetDest = new THREE.Vector3();

const tip = document.getElementById('tip');
const tipName = document.getElementById('tip-name');
const tipRules = document.getElementById('tip-rules');

function onMouseMove(e){
  mouse.x = (e.clientX / window.innerWidth)*2-1;
  mouse.y = -(e.clientY / window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(orbMeshes);
  if(hits.length > 0){
    const hitMesh = hits[0].object;
    const entry = orbData.find(o=>o.inner===hitMesh);
    if(entry){
      hoveredOrb = entry;
      canvas.style.cursor='pointer';
      tipName.textContent = entry.cfg.emoji + ' ' + entry.cfg.name;
      tipRules.textContent = entry.cfg.rules + ' — click to explore';
      tip.style.left = e.clientX+'px';
      tip.style.top  = e.clientY+'px';
      tip.classList.add('on');
      return;
    }
  }
  hoveredOrb = null;
  canvas.style.cursor='';
  tip.classList.remove('on');
}

function onMouseClick(e){
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(orbMeshes);
  if(hits.length > 0){
    const hitMesh = hits[0].object;
    const entry = orbData.find(o=>o.inner===hitMesh);
    if(entry) selectZone(entry.cfg.id);
  }
}

canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('click', onMouseClick);

// Touch support
canvas.addEventListener('touchend', e=>{
  if(e.changedTouches.length){
    const t=e.changedTouches[0];
    mouse.x=(t.clientX/window.innerWidth)*2-1;
    mouse.y=-(t.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(orbMeshes);
    if(hits.length>0){
      const entry=orbData.find(o=>o.inner===hits[0].object);
      if(entry){ selectZone(entry.cfg.id); e.preventDefault(); }
    }
  }
},{passive:false});

// ── SELECT ZONE ──
function selectZone(id){
  selectedId = id;
  const cfg = ZONE_CFG.find(z=>z.id===id);
  if(!cfg) return;

  // Fly camera
  camDest.set(...cfg.cp);
  camTargetDest.set(...cfg.ct);
  camAnimating = true;
  controls.enabled = false;

  // Chips
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  const chip = document.getElementById('chip-'+id);
  if(chip) chip.classList.add('sel');

  // Panel
  openPanel(id, cfg);
}

function openPanel(id, cfg){
  const data = ZONE_DATA[id];
  if(!data) return;

  const headEl = document.getElementById('panel-head-content');
  headEl.innerHTML = `
    <div class="p-badge" style="background:${cfg.css}18;color:${cfg.css};border:1px solid ${cfg.css}40">
      ${cfg.emoji} ${cfg.name}
    </div>
    <div class="p-name">${cfg.name}</div>
    <div class="p-sub">${cfg.rules}</div>
  `;

  const bodyEl = document.getElementById('panel-body');
  const rulesHTML = data.rules.map(r=>`
    <div class="rc">
      <div class="rc-head">
        <span class="rc-num">Rule ${r.num}</span>
        <span class="rc-title">${r.title}</span>
      </div>
      <div class="rc-body">
        <div class="rc-key">${r.key}</div>
        <div class="rc-trick">${r.trick}</div>
      </div>
    </div>
  `).join('');

  bodyEl.innerHTML = `
    <div class="mem-block">${data.memory}</div>
    ${rulesHTML}
  `;

  document.getElementById('panel').classList.add('open');
}

window.closePanel = function(){
  document.getElementById('panel').classList.remove('open');
  selectedId = null;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  // Return to default view
  camDest.set(28, 16, 30);
  camTargetDest.set(0, 3, 0);
  camAnimating = true;
  controls.enabled = false;
};

// ── BUILD CHIPS ──
const chipsEl = document.getElementById('chips');
ZONE_CFG.forEach(cfg=>{
  const c = document.createElement('div');
  c.className='chip';
  c.id='chip-'+cfg.id;
  c.textContent=cfg.emoji+' '+cfg.name;
  c.style.color=cfg.css;
  c.style.borderColor=cfg.css+'44';
  c.style.background=cfg.css+'14';
  c.onclick=()=>selectZone(cfg.id);
  chipsEl.appendChild(c);
});

// ── RESIZE ──
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  composer.setSize(window.innerWidth,window.innerHeight);
  bloom.setSize(window.innerWidth,window.innerHeight);
});

// ── ANIMATION LOOP ──
const clock = new THREE.Clock();
let time = 0;
let propAngle = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  time += dt;

  // Ocean waves
  oceanUni.time.value = time;

  // Camera lerp
  if(camAnimating){
    camera.position.lerp(camDest, 0.04);
    controls.target.lerp(camTargetDest, 0.04);
    controls.update();
    if(camera.position.distanceTo(camDest) < 0.5){
      camAnimating = false;
      controls.enabled = true;
      controls.update();
    }
  } else {
    controls.update();
  }

  // Orb animations
  orbData.forEach((entry, i)=>{
    const isSelected = selectedId === entry.cfg.id;
    const isHovered  = hoveredOrb === entry;
    const pulse = Math.sin(time * 1.8 + i * 0.9) * 0.5 + 0.5;

    // Scale
    const baseScale = isSelected ? 1.4 : (isHovered ? 1.2 : 1.0);
    const targetScale = baseScale + pulse * (isSelected ? 0.2 : 0.08);
    entry.inner.scale.setScalar(targetScale);

    // Ring rotation
    const speed = isSelected ? 2 : (isHovered ? 1.2 : 0.5);
    entry.ring.rotation.x  += dt * speed * 1.0;
    entry.ring2.rotation.y += dt * speed * 0.7;

    // Emissive intensity
    const mat = entry.inner.material;
    const targetEmit = isSelected ? 5 + pulse*2 : (isHovered ? 4 : 2.5 + pulse*0.8);
    mat.emissiveIntensity += (targetEmit - mat.emissiveIntensity) * 0.1;

    // Dim non-selected orbs when something is selected
    const targetOpacity = (!selectedId || isSelected) ? 1.0 : 0.35;
    mat.opacity += (targetOpacity - mat.opacity) * 0.08;

    // Ring opacity
    entry.ring.material.opacity  += (targetOpacity - entry.ring.material.opacity) * 0.08;
    entry.ring2.material.opacity += (targetOpacity - entry.ring2.material.opacity) * 0.08;

    // Light intensity
    entry.pl.intensity += ((isSelected ? 2.5 : isHovered ? 1.8 : 0.8) - entry.pl.intensity) * 0.1;

    // Gentle float
    entry.grp.position.y = entry.cfg.pos[1] + Math.sin(time * 0.8 + i * 1.1) * 0.12;
  });

  // Nav light flicker
  portPL.intensity  = 3.8 + Math.sin(time * 7.3) * 0.2;
  stbdPL.intensity  = 3.8 + Math.sin(time * 6.8 + 1) * 0.2;

  composer.render();
}

// ── INIT ──
function init(){
  const fill = document.getElementById('load-bar-fill');
  let progress = 0;
  const iv = setInterval(()=>{
    progress = Math.min(progress + Math.random()*18, 100);
    fill.style.width = progress + '%';
    if(progress >= 100){
      clearInterval(iv);
      setTimeout(()=>{
        document.getElementById('load').classList.add('out');
        animate();
      }, 400);
    }
  }, 80);
}

init();
</script>
